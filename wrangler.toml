# Cloudflare Pages 项目配置
# 注意：这个文件存在时，后台的「绑定」会被锁定，绑定只能改这里
name = "members-site"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

# 数据库绑定（必须有，删了网站会 500）
[[d1_databases]]
binding = "DB"
database_name = "members-db"
database_id = "c6eff260-17bd-47b0-b60f-1b5295424323"

# 文件存储：Workers KV（免费 1GB，单文件上限 25MB）
[[kv_namespaces]]
binding = "FILES_KV"
id = "2b5b8efb902e49f99c044e89bf6c62b7"
