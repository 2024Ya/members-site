<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读 · 个人规范库</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="brand-dot">G</span><span data-site-name>个人规范库</span></a>
    <nav class="nav" id="nav-actions"></nav>
  </div>
</header>

<main class="section">
  <div class="container" style="max-width:780px">
    <a class="small" href="/app" style="display:inline-block; margin-bottom:20px">← 返回会员中心</a>
    <div id="content">
      <div class="empty">正在加载…</div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container center"><span data-site-name>个人规范库</span></div>
</footer>

<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/markdown.js"></script>
<script>
  (async function () {
    await UI.mountNav();

    const user = await UI.requireLogin();
    if (!user) return;

    const id = new URLSearchParams(location.search).get('id') || '';
    const content = document.getElementById('content');

    if (!id) {
      content.innerHTML = '<div class="empty">没有指定要阅读的文章，<a href="/app">回会员中心</a></div>';
      return;
    }

    try {
      const data = await API.get('/articles/' + encodeURIComponent(id));
      const a = data.article;

      document.title = a.title + ' · ' + ((window.SITE && window.SITE.name) || '个人规范库');

      content.innerHTML =
        '<article>' +
          '<h1 style="margin-bottom:10px">' + UI.escapeHtml(a.title) + '</h1>' +
          '<div class="article-meta" style="margin-bottom:26px">' +
            '<span>' + UI.formatDate(a.created_at) + '</span>' +
            '<span class="badge badge-brand">会员专享</span>' +
            (a.published ? '' : '<span class="badge badge-warn">草稿（仅管理员可见）</span>') +
          '</div>' +
          '<div class="prose">' +
            (a.content ? window.renderMarkdown(a.content) : '<p class="muted">（正文还是空的）</p>') +
          '</div>' +
        '</article>';
    } catch (err) {
      content.innerHTML =
        '<div class="empty">' +
          '<div class="big">🔍</div>' +
          '<p style="margin:0 0 6px">' + UI.escapeHtml(err.message) + '</p>' +
          '<p class="small" style="margin:0"><a href="/app">返回会员中心</a></p>' +
        '</div>';
    }
  })();
</script>
</body>
</html>
