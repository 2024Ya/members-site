<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 会员站</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="brand-dot">M</span><span data-site-name>会员站</span></a>
    <nav class="nav" id="nav-actions"></nav>
  </div>
</header>

<main class="section">
  <div class="container container-narrow">
    <div class="card">
      <h1 style="font-size:1.5rem">登录</h1>
      <p class="muted small" style="margin-bottom:22px">登录后即可阅读全部会员内容</p>

      <div id="alert" class="alert alert-error hidden"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">邮箱</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input class="input" type="password" id="password" name="password" autocomplete="current-password" placeholder="至少 8 位" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">登录</button>
      </form>

      <div class="row" style="margin-top:18px; justify-content:space-between">
        <a class="small" href="/forgot">忘记密码？</a>
        <a class="small" href="/register">还没有账号？免费注册</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container center"><span data-site-name>会员站</span></div>
</footer>

<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script>
  (async function () {
    const user = await UI.mountNav();
    if (user) {
      location.replace(UI.safeNext('/app'));
      return;
    }

    const params = new URLSearchParams(location.search);
    if (params.get('verified') === '1') {
      UI.showAlert('alert', '邮箱验证成功，现在可以登录了', 'ok');
    } else if (params.get('reset') === '1') {
      UI.showAlert('alert', '密码已重置，请用新密码登录', 'ok');
    }

    const form = document.getElementById('login-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      UI.hideAlert('alert');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        UI.showAlert('alert', '请填写邮箱和密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中…';
      try {
        await API.post('/auth/login', { email: email, password: password });
        location.href = UI.safeNext('/app');
      } catch (err) {
        UI.showAlert('alert', err.message);
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  })();
</script>
</body>
</html>
