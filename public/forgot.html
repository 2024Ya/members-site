<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找回密码 · 会员站</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="brand-dot">M</span><span data-site-name>会员站</span></a>
    <nav class="nav" id="nav-actions"></nav>
  </div>
</header>

<main class="section">
  <div class="container container-narrow">
    <div class="card">
      <h1 style="font-size:1.5rem">找回密码</h1>
      <p class="muted small" style="margin-bottom:22px">输入注册时用的邮箱，我们会发一封重置密码的邮件给你</p>

      <div id="alert" class="alert alert-error hidden"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">邮箱</label>
          <input class="input" type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">发送重置邮件</button>
      </form>

      <p class="small muted" style="margin:18px 0 0; text-align:center">
        想起来了？<a href="/login">返回登录</a>
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container center"><span data-site-name>会员站</span></div>
</footer>

<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script>
  (async function () {
    await UI.mountNav();

    const form = document.getElementById('forgot-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      UI.hideAlert('alert');

      const email = document.getElementById('email').value.trim();
      if (!email) return UI.showAlert('alert', '请填写邮箱');

      btn.disabled = true;
      btn.textContent = '发送中…';
      try {
        const data = await API.post('/auth/forgot', { email: email });
        UI.showAlert('alert', data.message || '如果这个邮箱注册过，重置邮件已经发出', 'ok');
        btn.textContent = '已发送';
      } catch (err) {
        UI.showAlert('alert', err.message);
        btn.disabled = false;
        btn.textContent = '发送重置邮件';
      }
    });
  })();
</script>
</body>
</html>
